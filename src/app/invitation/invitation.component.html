<div class="container">
  @if (inviteSuccess === true) {
  <div class="container-inner">
    <p class="company-name">{{ groupName }}</p>
    <div>
      <img mat-card-image src="./assets/images/invited.png" alt="招待されました" />
    </div>
    <p class="description">malmeAppの組織に招待されました。<br />{{ message }}</p>
  </div>
  } @if (inviteSuccess === false) {
  <div class="container-inner">
    <p class="description">エラーが発生しました。<br />管理者にお問い合わせください。</p>
  </div>
  } @if (inviteSuccess === null) {
  <div class="container-inner">
    <mat-spinner></mat-spinner>
  </div>
  }
</div>
