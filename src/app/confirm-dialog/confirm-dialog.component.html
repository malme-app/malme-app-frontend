<div class="confirm-dialog">
  <h2 mat-dialog-title>
    @for (line of data.title.split('\n'); track line; let last = $last) {
    {{ line }}@if (!last) {
    <br />
    } }
  </h2>
  <mat-dialog-content>
    {{ data.message }}
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    @if (data.cancelBtn) {
    <button mat-button (click)="onCancel()" class="confirm-dialog__cancel">
      {{ data.cancelBtn }}
    </button>
    }
    <button mat-button (click)="onConfirm()" class="confirm-dialog__accept" cdkFocusInitial>
      {{ data.acceptBtn }}
    </button>
  </mat-dialog-actions>
</div>
