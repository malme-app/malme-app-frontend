@if (header.visible) {
<header>
  <img
    class="logo"
    src="./assets/images/malme_logo.svg"
    alt="Malme"
    (click)="navigateMalmePage()"
  />
  @if (!userInfo.systemProfile && authPending) {
  <div class="btn-wrapper">
    <mat-spinner diameter="24" aria-label="Loading"></mat-spinner>
  </div>
  } @if (!userInfo.systemProfile && !authPending) {
  <div class="btn-wrapper">
    <button class="login-btn" (click)="login()">Login</button>
    <button class="login-btn" (click)="signup()">Signup</button>
  </div>
  } @if (userInfo.systemProfile) {
  <div class="btn-wrapper">
    <button mat-fab extended [matMenuTriggerFor]="menu" class="header-btn">
      <mat-icon>account_circle</mat-icon>{{ userInfo.systemProfile.lastName }}
      {{ userInfo.systemProfile.firstName }}さん
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="logout()">ログアウト</button>
    </mat-menu>
  </div>
  }
</header>
}
