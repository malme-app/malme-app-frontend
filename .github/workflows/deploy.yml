name: Build and Deploy Frontend

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      ANGULAR_CONFIG: ${{ github.ref_name == 'main' && 'production' || 'stg' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_USER: ${{ vars.SSH_USER || 'ec2-user' }}
      SSH_HOST: ${{ vars.SSH_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.APP_ENV }}-${{ github.sha }}
        run: |
          docker build --build-arg ANGULAR_CONFIG="${ANGULAR_CONFIG}" \
            -t "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}" \
            -t "${REGISTRY}/${REPOSITORY}:${APP_ENV}-latest" .
          docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${REPOSITORY}:${APP_ENV}-latest"

      # The production security group has no inbound port 22, so SSH goes through
      # an SSM port-forwarding tunnel. Enabled by setting SSM_INSTANCE_ID on the environment.
      - name: Require SSM tunnel on production
        if: env.APP_ENV == 'production' && vars.SSM_INSTANCE_ID == ''
        run: |
          echo "::error::SSM_INSTANCE_ID is not set on the production environment; direct SSH (port 22) is closed."
          exit 1

      - name: Open SSM tunnel to EC2
        id: ssm-tunnel
        if: vars.SSM_INSTANCE_ID != ''
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          LOCAL_PORT: '2222'
        run: |
          if ! command -v session-manager-plugin >/dev/null; then
            curl -fsSL -o "${RUNNER_TEMP}/session-manager-plugin.deb" \
              https://s3.amazonaws.com/session-manager-downloads/plugin/1.2.835.0/ubuntu_64bit/session-manager-plugin.deb
            sudo dpkg -i "${RUNNER_TEMP}/session-manager-plugin.deb"
          fi

          nohup aws ssm start-session \
            --region "${AWS_REGION}" \
            --target "${SSM_INSTANCE_ID}" \
            --document-name AWS-StartPortForwardingSession \
            --parameters "{\"portNumber\":[\"${SSH_PORT}\"],\"localPortNumber\":[\"${LOCAL_PORT}\"]}" \
            > "${RUNNER_TEMP}/ssm-tunnel.log" 2>&1 &
          tunnel_pid=$!

          for _ in $(seq 1 30); do
            kill -0 "${tunnel_pid}" 2>/dev/null || break
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/${LOCAL_PORT}" 2>/dev/null; then
              echo "host=127.0.0.1" >> "$GITHUB_OUTPUT"
              echo "port=${LOCAL_PORT}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/ssm-tunnel.log"
          exit 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV: ${{ env.APP_ENV }}
          AWS_REGION: ${{ env.AWS_REGION }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.APP_ENV }}-${{ github.sha }}
          CONTAINER_NAME: malme-app-frontend-${{ env.APP_ENV }}
          # drone-ssh reads SSH_HOST/SSH_PORT before the action inputs, so override the job-level values.
          SSH_HOST: ${{ steps.ssm-tunnel.outputs.host || env.SSH_HOST }}
          SSH_PORT: ${{ steps.ssm-tunnel.outputs.port || env.SSH_PORT }}
        with:
          host: ${{ steps.ssm-tunnel.outputs.host || env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ steps.ssm-tunnel.outputs.port || env.SSH_PORT }}
          script_stop: true
          envs: APP_ENV,AWS_REGION,REGISTRY,IMAGE,CONTAINER_NAME
          script: |
            set -e

            aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"

            CERT_DIR="$HOME/malme-app-frontend/nginx"
            if [ ! -f "${CERT_DIR}/malmeCert.pem" ] || [ ! -f "${CERT_DIR}/malmeCert.key" ]; then
              echo "Missing ${CERT_DIR}/malmeCert.pem or malmeCert.key on host. Aborting." >&2
              exit 1
            fi

            docker pull "${IMAGE}"
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm "${CONTAINER_NAME}" 2>/dev/null || true

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --add-host host.docker.internal:host-gateway \
              -v "${CERT_DIR}/malmeCert.pem:/etc/nginx/malmeCert.pem:ro" \
              -v "${CERT_DIR}/malmeCert.key:/etc/nginx/malmeCert.key:ro" \
              -p 80:80 \
              -p 443:443 \
              --log-driver awslogs \
              --log-opt awslogs-region="${AWS_REGION}" \
              --log-opt awslogs-group="/malme-app-frontend/${APP_ENV}" \
              --log-opt awslogs-create-group=true \
              --log-opt awslogs-stream="${CONTAINER_NAME}" \
              "${IMAGE}"

            docker image prune -af --filter "until=72h" || true

      - name: Show SSM tunnel log
        if: failure() && steps.ssm-tunnel.outcome == 'success'
        run: cat "${RUNNER_TEMP}/ssm-tunnel.log"

      - name: Deploy summary
        env:
          DEPLOY_TARGET: ${{ steps.ssm-tunnel.outcome == 'success' && format('{0} (SSM tunnel)', vars.SSM_INSTANCE_ID) || env.SSH_HOST }}
          IMAGE_TAG: ${{ env.APP_ENV }}-${{ github.sha }}
        run: |
          {
            echo "- Environment: ${APP_ENV}"
            echo "- Host: ${DEPLOY_TARGET}"
            echo "- Image: ${IMAGE_TAG}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
